# Gremlins site on one server: the board (API + pages + static site) behind Caddy (automatic HTTPS).
#   SITE_DOMAIN=gremlins.example.com docker compose up -d
services:
  site:
    image: gremlins/site:${SITE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - board-data:/data
    environment:
      BOARD_DB: /data/board.db
      # Gremlin Forge (optional): Claude designs, an image model photographs. Unset keys leave that half off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FORGE_PHOTO_PROVIDER: ${FORGE_PHOTO_PROVIDER:-}
      FORGE_PHOTO_MODEL: ${FORGE_PHOTO_MODEL:-}
      # Hatch custody for Fluence eggs (apps/board/src/hatch-live.ts): on when all three of the first are set.
      BOARD_HATCH_SECRET: ${BOARD_HATCH_SECRET:-}
      BOARD_EGG_IMAGE: ${BOARD_EGG_IMAGE:-}
      BOARD_PUBLIC_URL: ${BOARD_PUBLIC_URL:-}
      BOARD_EGG_DEV_SSH_KEYS: ${BOARD_EGG_DEV_SSH_KEYS:-}
      BOARD_HATCH_CUSTODY: ${BOARD_HATCH_CUSTODY:-mpc}
    expose:
      - "8787"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN to the site's domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - site
volumes:
  board-data:
  caddy-data:
