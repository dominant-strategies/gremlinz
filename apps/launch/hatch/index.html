<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hatch a gremlin</title>
  <style>
    :root { --bg: #fbfaf7; --fg: #1d1b18; --muted: #6b665d; --accent: #2f7d5b; --card: #fff; --line: #e4e0d8; --err: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151412; --fg: #ece8e1; --muted: #a39d92; --accent: #5cc195; --card: #1e1c19; --line: #34312c; --err: #ff8a80; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.4rem; margin: 0 0 24px; } h2 { font-size: 1.2rem; }
    form, fieldset { display: grid; gap: 12px; } fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    label { display: grid; gap: 4px; } label:has(input[type=checkbox]), label:has(input[type=radio]) { display: flex; gap: 8px; align-items: baseline; }
    input, textarea, select { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); width: 100%; }
    input[type=checkbox], input[type=radio] { width: auto; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; justify-self: start; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    code { word-break: break-all; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
    .uri { display: block; padding: 8px; } .muted { color: var(--muted); } .error { color: var(--err); }
    dl.deposit dt { font-weight: 600; margin-top: 12px; } dl.deposit dd { margin: 4px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1><a href="/" style="color:inherit;text-decoration:none">gremlins</a> · hatch</h1>
    <div id="app"></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
