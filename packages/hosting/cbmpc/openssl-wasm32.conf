# OpenSSL target for cb-mpc on wasm32 (build-inner.sh): generic C, 64-bit bignum limbs (unsigned long long, with
# clang's __int128 for the double-width products) so cb-mpc's 64-bit-limb constant-time code applies unchanged.
my %targets = (
    "gremlins-wasm32" => {
        inherit_from => [ "linux-generic32" ],
        bn_ops       => "SIXTY_FOUR_BIT",
    },
);
